# Task-focused Context Resolver manifest — Movies Wrapped (letterboxd_wrapped)
# Resolver: ~/.hermes/hooks/pre-llm/context-resolver.py (pre_llm_call hook)
#
# Sıra: AgentMemory context (mevcut agentmemory-context.py hook'u) → bu manifest
# eşleşirse tek bir Graphify Context Pack. Graphify türetilmiş kod navigasyon
# katmanıdır; kanonik memory DEĞİLDİR (AgentMemory canonical'dir).

# Canonical intent / runbook / project summary paths (AgentMemory side).
# Resolver bunları enjekte etmez — mevcut shared injector zaten proje notunu
# getirir; bu path'ler doğrulama ve elle inceleme için manifestte tutulur.
agentmemory:
  project: ~/Belgeler/AgentMemory/projects/letterboxd_wrapped.md
  wayfinder: ~/Belgeler/AgentMemory/projects/wayfinder.md
  intent: intent.md                      # repo-local intent (varsa)
  decisions_dir: ~/Belgeler/AgentMemory/decisions/

# Derived code-navigation layer (NOT canonical memory).
graphify:
  graph: graphify-out/graph.json         # repo root'a göre (CWD)
  depth: 3                               # BFS komşuluk derinliği
  char_budget: 1400                      # Context Pack üst sınırı

# Task keywords → graph query mapping (max 3). İlk eşleşen kazanır;
# eşleşme yoksa graph çağrısı yapılmaz (ürün/niyet sorusu = graph yok).
tasks:
  worker:
    keywords: [worker, scrape, queue, job, heartbeat, protocol, desktop]
    query: "worker scrape queue heartbeat protocol desktop"
  results:
    keywords: [results, data, flow, analysis, stats, section, render]
    query: "results analysis data flow section render"
  review:
    keywords: [review, likes, story, share, fixture]
    query: "review likes story share fixture"

# Critical surfaces — graph çağrısı yapıldığında kısa pointer listesi olarak
# Context Pack'e eklenir (kaynak-linkli yönlendirme).
critical_surfaces:
  - frontend/src/app/results/page.tsx
  - backend/app/services/scraper.py
  - backend/app/services/scrape_pipeline.py
  - backend/app/services/review_analysis.py
